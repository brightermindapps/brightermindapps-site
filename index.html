<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brighter Mind Apps</title>
<style>
  :root { --ink:#1a1a2e; --soft:#55566f; --accent:#0f5c4c; --wash:#e6f0ec; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    color: var(--ink); background: #fbfbfd; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; line-height: 1.6;
  }
  .card { max-width: 560px; text-align: center; }
  .badge {
    display: inline-block; background: var(--wash); color: var(--accent);
    font-weight: 600; font-size: 0.8rem; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 6px 14px; border-radius: 999px;
    margin-bottom: 24px;
  }
  h1 { font-size: 2.4rem; margin-bottom: 12px; }
  p { color: var(--soft); font-size: 1.1rem; margin-bottom: 8px; }
  .links { margin-top: 32px; }
  a {
    color: var(--accent); text-decoration: none; font-weight: 600;
    border-bottom: 1px solid transparent; transition: border-color .15s;
  }
  a:hover { border-color: var(--accent); }
  footer { margin-top: 40px; font-size: 0.85rem; color: var(--soft); }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Coming soon</span>
    <h1>Brighter Mind Apps</h1>
    <p>We build tools that help families and classrooms make time for
       learning.</p>
    <p>Our first app, Lockout, is on the way.</p>
    <div class="links">
      <a href="/privacy/">Privacy Policy</a>
    </div>
    <footer>
      Contact: <a href="mailto:brightermindapps@gmail.com"
        >brightermindapps@gmail.com</a>
    </footer>
  </div>
</body>
</html>
